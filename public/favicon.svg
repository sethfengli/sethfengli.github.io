  <g fill="#1c1a17" opacity="0.78">
    <path d="M32 34c-2.4 4.6-6.6 7.8-10.4 8.6 0-5.6 2.4-11 6.9-13.6 1.4 1.4 2.8 3 3.5 5z"/>
