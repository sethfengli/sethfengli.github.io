  <!-- 莲蓬一点朱砂 -->
  <ellipse cx="32" cy="24.6" rx="3" ry="2.4" fill="#b8382e"/>
  <!-- 花梗 -->
  <path d="M32 36v16" stroke="#1c1a17" stroke-width="2.4" stroke-linecap="round" opacity="0.7"/>
